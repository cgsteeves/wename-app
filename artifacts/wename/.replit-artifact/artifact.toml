kind = "mobile"
previewPath = "/"
title = "WeName"
version = "1.0.0"
id = "artifacts/wename"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 19315

[services.development]
run = "pnpm --filter @workspace/wename run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/wename", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/wename", "run", "serve" ]

[services.env]
PORT = "19315"
BASE_PATH = "/"
