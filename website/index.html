<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WeName — Baby Name App for Couples</title>
  <meta name="description" content="Swipe on baby names together. WeName helps couples find names they both love." />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #fdf8ee;
      color: #2d2a24;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      text-align: center;
    }
    .logo {
      font-size: 48px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 36px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #2d5a27;
    }
    p {
      font-size: 18px;
      color: #6b6457;
      max-width: 480px;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .badge {
      display: inline-block;
      margin: 8px;
    }
    .badge img {
      height: 52px;
    }
    nav {
      margin-top: 48px;
      font-size: 14px;
      color: #9e9689;
    }
    nav a {
      color: #9e9689;
      text-decoration: none;
      margin: 0 12px;
    }
    nav a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="logo">🌿</div>
  <h1>WeName</h1>
  <p>Swipe on baby names together. Discover the names you both love — no arguments, just matches.</p>
  <div>
    <a class="badge" href="https://apps.apple.com/app/wename" target="_blank" rel="noopener">
      <img src="https://developer.apple.com/assets/elements/badges/download-on-the-app-store.svg" alt="Download on the App Store" />
    </a>
  </div>
  <nav>
    <a href="/privacy">Privacy Policy</a>
    <a href="/support">Support</a>
  </nav>
</body>
</html>
